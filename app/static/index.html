<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estaciones de metro de NYC</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Estaciones de metro de NYC</h1>
  </header>

  <main>
    <section class="panel">
      <form id="filters">
        <label>Nombre
          <input type="text" name="name" placeholder="Ej. Times Sq" />
        </label>
        <label>Distrito
          <select name="borough">
            <option value="">Todos</option>
            <option>Manhattan</option>
            <option>The Bronx</option>
            <option>Brooklyn</option>
            <option>Staten Island</option>
            <option>Queens</option>
          </select>
        </label>
        <label>Línea
          <input type="text" name="route" maxlength="5" placeholder="Ej. A, 4, N" />
        </label>
        <label>Express
          <select name="express">
            <option value="">Indiferente</option>
            <option value="true">Solo express</option>
            <option value="false">Sin express</option>
          </select>
        </label>

        <fieldset>
          <legend>Cercanía (opcional)</legend>
          <label>Latitud <input type="number" name="lat" step="any" min="-90" max="90" /></label>
          <label>Longitud <input type="number" name="lon" step="any" min="-180" max="180" /></label>
          <label>Radio (m) <input type="number" name="radius_m" min="1" max="50000" /></label>
          <button type="button" id="use-location">Usar mi ubicación</button>
        </fieldset>

        <p class="hint">Para filtrar por zona, dibuja un polígono, rectángulo o círculo en el mapa (barra de herramientas a la izquierda del mapa).</p>

        <label>Resultados por página
          <select name="limit">
            <option>25</option>
            <option selected>50</option>
            <option>100</option>
            <option>500</option>
          </select>
        </label>

        <div class="actions">
          <button type="submit">Buscar</button>
          <button type="button" id="reset">Limpiar</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Estación</th><th>Distrito</th><th>Líneas</th><th>Express</th><th>Dist. (m)</th></tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>

      <nav class="pager">
        <button id="prev" type="button">&laquo; Anterior</button>
        <span id="page-info"></span>
        <button id="next" type="button">Siguiente &raquo;</button>
      </nav>
    </section>

    <section id="map" aria-label="Mapa de estaciones"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="/app.js"></script>
</body>
</html>
