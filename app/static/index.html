<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Explorador de datos espaciales de Nueva York: metro, homicidios, barrios, calles y bloques censales, con filtros, búsqueda por zona y mapa interactivo." />
  <title>NYC Spatial Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true">M</span>
      <div class="brand-text">
        <h1>NYC Spatial Explorer</h1>
        <p>Datos espaciales de Nueva York</p>
      </div>
    </div>
    <nav class="topbar-links">
      <a href="/docs" target="_blank" rel="noopener">Documentación de la API</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav id="dataset-tabs" class="tabs" role="tablist" aria-label="Conjunto de datos"></nav>
      <p id="dataset-description" class="hint"></p>

      <form id="filters" class="card" autocomplete="off">
        <div class="card-title">
          <h2>Filtros</h2>
          <button type="button" id="clear-all" class="link-btn">Limpiar todo</button>
        </div>

        <div id="dynamic-filters" class="dynamic-filters"></div>

        <details class="nearby">
          <summary>Búsqueda por cercanía</summary>
          <p class="hint">También puedes dibujar un polígono, rectángulo o círculo en el mapa para filtrar por zona. La figura se mantiene al cambiar de conjunto de datos.</p>
          <div class="grid-3">
            <label class="field"><span>Latitud</span><input type="number" name="lat" step="any" min="-90" max="90" /></label>
            <label class="field"><span>Longitud</span><input type="number" name="lon" step="any" min="-180" max="180" /></label>
            <label class="field"><span>Radio (m)</span><input type="number" name="radius_m" min="1" max="50000" /></label>
          </div>
          <button type="button" id="use-location" class="btn btn-secondary">Usar mi ubicación</button>
        </details>

        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>

      <section class="results" aria-labelledby="results-title">
        <div class="results-head">
          <h2 id="results-title">Resultados</h2>
          <span id="count" class="count-pill">–</span>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <ul id="results" class="station-list"></ul>

        <div class="pager">
          <button id="prev" type="button" class="btn btn-secondary" aria-label="Página anterior">Anterior</button>
          <div class="pager-info">
            <span id="page-info">–</span>
            <label class="per-page">
              <span>Por página</span>
              <select id="per-page" name="limit" form="filters"></select>
            </label>
          </div>
          <button id="next" type="button" class="btn btn-secondary" aria-label="Página siguiente">Siguiente</button>
        </div>
      </section>
    </aside>

    <main id="map" aria-label="Mapa"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="/app.js"></script>
</body>
</html>
